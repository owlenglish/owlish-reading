# Makes MP3 audio for readings automatically.
# Upload a reading .html -> a few minutes later audio/<reading>/ appears and the
# page plays it (works inside the Naver and KakaoTalk app browsers too).
name: Make reading audio

on:
  push:
    branches: [main]
    paths: ["*.html", "tools/make_audio.py", ".github/workflows/audio.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reading-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # always start from the newest main (not the commit that triggered the run),
      # so audio another run already made is seen and skipped
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "edge-tts>=7.0.0" playwright
          python -m playwright install --with-deps chromium
      - name: Make and save audio
        run: |
          git config user.name "owlish-audio-bot"
          git config user.email "owlish-audio-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python tools/make_audio.py
            git add audio
            if git diff --cached --quiet; then echo "No audio changes"; exit 0; fi
            git commit -q -m "Update reading audio"
            if git push -q origin HEAD:main; then echo "Saved audio"; exit 0; fi
            echo "main moved while making audio; starting again on top of it (try $attempt)"
          done
          exit 1
