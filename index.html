<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owlish English — Reading Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f2e9;--ink:#22201c;--muted:#6b6358;--line:#d8cfbe;--card:#fffdf8;
    --shadow:0 1px 0 rgba(0,0,0,.04), 0 14px 34px -20px rgba(40,30,10,.4);
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:0 18px 90px;
    background:
      radial-gradient(circle at 12% -10%, #fbf7ee 0, transparent 45%),
      radial-gradient(circle at 100% 0, #f0eadc 0, transparent 40%),
      var(--paper);
    color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:18px;line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto}

  header.mast{padding:46px 0 22px;border-bottom:2px solid var(--ink);margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:12px}
  .owl{font-size:34px;line-height:1}
  .brandtext{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(32px,6vw,50px);line-height:1.04;margin:.2em 0 .18em;letter-spacing:-.01em}
  .lede{font-family:"Newsreader",serif;font-style:italic;color:var(--muted);font-size:20px;margin:0;max-width:60ch}

  .count{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.1em;color:var(--muted);
    text-transform:uppercase;margin:0 0 14px;min-height:16px}

  .grid{display:grid;gap:18px}
  .card{
    display:block;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 1px 0 rgba(0,0,0,.04),0 22px 44px -22px rgba(40,30,10,.5);border-color:#c8bda7}
  .card h2{font-family:"Fraunces",serif;font-weight:600;font-size:25px;line-height:1.15;margin:0 0 .25em}
  .card p{margin:0 0 14px;color:var(--muted);font-size:17px}
  .levels{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .lv{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.04em;
    color:#fff;background:#6b6358;padding:3px 9px;border-radius:6px}
  .lv.a1{background:#c2603a}.lv.a2{background:#c9942f}.lv.b1{background:#2f7d5b}.lv.c1{background:#2f6f8f}.lv.c2{background:#5b4b8a}
  .go{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
  .card:hover .go{color:#000}

  .msg{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:26px;color:var(--muted);text-align:center}

  footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--line);
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <div class="brand"><span class="owl">🦉</span><span class="brandtext">Owlish English</span></div>
    <h1>Reading Library</h1>
    <p class="lede">Graded readings with read-aloud audio — choose your level, listen, and answer along.</p>
  </header>

  <p class="count" id="count">Loading readings…</p>
  <div class="grid" id="grid"></div>

  <footer>Owlish English · Reading Library</footer>
</div>

<script>
  /* ───────────────────────────────────────────────────────────────────────
     AUTO-DETECTING LIBRARY
     This page reads the repo's file list and builds a card for every reading
     it finds. To add a new reading: just upload its .html file to this repo.
     Each reading describes itself with these tags in its <head>:
         <meta name="reading-title"  content="…">
         <meta name="reading-desc"   content="…">
         <meta name="reading-levels" content="A2,B1,C1">
         <meta name="reading-order"  content="2">   (optional; lower = higher up)
     You never need to edit this file again.
     ─────────────────────────────────────────────────────────────────────── */
  const OWNER = "owlenglish";
  const REPO  = "owlish-reading";

  // Used only if GitHub's file list can't be reached (offline, rate-limited, etc.)
  const FALLBACK = [
    { title:"Can Kimchi Save Us From Microplastics?",
      desc:"A science-and-opinion read on the viral kimchi study — and why no diet fixes a plastic problem.",
      levels:["a1","a2","b1","c1","c2"], file:"kimchi.html", order:1 },
    { title:"Can a Sugar Pill Really Heal You?",
      desc:"The placebo effect — how belief, expectation, and care produce real, measurable healing.",
      levels:["a2","b1","c1"], file:"placebo.html", order:2 }
  ];

  const grid = document.getElementById("grid");
  const count = document.getElementById("count");

  function render(readings){
    if(!readings.length){
      count.textContent = "";
      grid.innerHTML = '<div class="msg">No readings yet — upload one to this repo and it will appear here.</div>';
      return;
    }
    readings.sort(function(a,b){ return (a.order||999)-(b.order||999) || a.title.localeCompare(b.title); });
    count.textContent = readings.length + (readings.length===1 ? " reading" : " readings");
    grid.innerHTML = readings.map(function(r){
      return '<a class="card" href="'+r.file+'">'
           +   '<h2>'+r.title+'</h2>'
           +   (r.desc ? '<p>'+r.desc+'</p>' : '')
           +   '<div class="levels">'
           +     (r.levels||[]).map(function(l){ return '<span class="lv '+l+'">'+l.toUpperCase()+'</span>'; }).join('')
           +     '<span class="go">Open &rarr;</span>'
           +   '</div>'
           + '</a>';
    }).join("");
  }

  async function readFileMeta(file){
    try{
      const r = await fetch(file.download_url);
      const html = await r.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const m = function(n){ var el = doc.querySelector('meta[name="'+n+'"]'); return el ? el.content : ""; };
      return {
        title:  m("reading-title") || (doc.title || file.name).replace(/\s*\|.*$/,""),
        desc:   m("reading-desc"),
        levels: (m("reading-levels")||"").split(",").map(function(s){return s.trim().toLowerCase();}).filter(Boolean),
        order:  parseInt(m("reading-order")) || 999,
        file:   file.name
      };
    }catch(e){
      return { title:file.name.replace(/\.html$/i,""), desc:"", levels:[], order:999, file:file.name };
    }
  }

  async function load(){
    try{
      const res = await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/",
                              { headers:{ "Accept":"application/vnd.github+json" } });
      if(!res.ok) throw new Error("list failed");
      const items = await res.json();
      const files = items.filter(function(it){
        return it.type === "file"
            && /\.html$/i.test(it.name)
            && it.name.toLowerCase() !== "index.html";
      });
      if(!files.length){ render([]); return; }
      const readings = await Promise.all(files.map(readFileMeta));
      render(readings);
    }catch(e){
      render(FALLBACK);  // GitHub unreachable — show built-in list so the page is never empty
    }
  }

  load();
</script>
</body>
</html>
